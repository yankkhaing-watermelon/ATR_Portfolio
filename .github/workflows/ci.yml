name: Validate ATR Portfolio

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: |
          node --check worker/index.js
          node --check worker/index-v4.js
          node --check worker/index-v4-fix.js
          node --check worker/index-v5.js
      - name: Check PWA scripts
        run: |
          node --check public/app.js
          node --check public/app-v4.js
          node --check public/manage.js
          node --check public/phase3-ui.js
          node --check public/risk.js
          node --check public/signals.js
